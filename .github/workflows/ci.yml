name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Some tests run `nix develop` (mkRepo smoke). Ubuntu runners don't ship with nix.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Run tests (JUnit + coverage)
        run: |
          mkdir -p test-results coverage
          bun test \
            --reporter=junit \
            --reporter-outfile=test-results/junit.xml \
            --coverage \
            --coverage-reporter=text \
            --coverage-reporter=lcov \
            --coverage-dir=coverage

      - name: Publish test report
        if: always() && hashFiles('test-results/junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: bun test
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: "false"

      - name: Upload coverage artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Upload coverage reports to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Optional client smoke tests (gated)
        if: vars.NEXUS_CLIENT_SMOKE == '1'
        run: bun run test:smoke:clients
