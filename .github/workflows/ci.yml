name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Some tests run `nix develop` (mkRepo smoke). Ubuntu runners don't ship with nix.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Run tests (JUnit)
        run: |
          mkdir -p test-results
          bun test --reporter=junit --reporter-outfile=test-results/junit.xml

      - name: Publish test report
        if: always() && hashFiles('test-results/junit.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: bun test
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: "false"
