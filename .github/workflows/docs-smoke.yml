name: Docs Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-smoke.yml"

jobs:
  docs-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs deps
        run: bun install --frozen-lockfile

      - name: Typecheck docs
        run: bunx tsc --noEmit

      - name: Build docs
        run: bun run build
